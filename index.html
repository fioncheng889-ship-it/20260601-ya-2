<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課程報價試算器</title>
    <!-- 引入 Noto Sans TC 字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* 設計語彙與變數設定 */
        :root {
            --bg-color: #f5f3ee;
            --primary-color: #6b7fa3;
            --primary-dark: #546584;
            --text-dark: #3a3a3a;
            --text-light: #6e6e6e;
            --white: #ffffff;
            --warning-bg: #fff5f5;
            --warning-border: #fc8181;
            --warning-text: #c53030;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 容器設計 */
        .calculator-container {
            background-color: var(--white);
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 480px;
            padding: 32px;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        /* 標題區 */
        .header {
            margin-bottom: 28px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            position: relative;
            display: inline-block;
            padding-bottom: 8px;
        }

        .header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 25%;
            width: 50%;
            height: 3px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        /* 表單與輸入欄位 */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-dark);
            font-family: inherit;
        }

        /* 各別輸入框後綴 (如 人、小時 等) */
        .input-wrapper::after {
            position: absolute;
            right: 16px;
            font-size: 0.85rem;
            color: var(--text-light);
            font-weight: 500;
            pointer-events: none;
        }

        #students-group .input-wrapper::after { content: '人'; }
        #hours-group .input-wrapper::after { content: '小時'; }
        #price-group .input-wrapper::after { content: '元/小時'; }
        #discount-group .input-wrapper::after { content: '%'; }

        /* 輸入框右側預留後綴空間 */
        .input-wrapper input {
            padding-right: 60px;
        }
        #price-group input {
            padding-right: 75px;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(107, 127, 163, 0.15);
        }

        /* 警示訊息樣式 */
        .warning-message {
            display: none;
            background-color: var(--warning-bg);
            border: 1px solid var(--warning-border);
            color: var(--warning-text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 8px;
            align-items: center;
            gap: 8px;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 試算結果區 */
        .results-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1.5px dashed #e2e8f0;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .result-label {
            color: var(--text-light);
        }

        .result-value {
            font-weight: 500;
            color: var(--text-dark);
        }

        /* 總計特別突出樣式 */
        .total-row {
            margin-top: 20px;
            padding: 16px;
            background-color: rgba(107, 127, 163, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(107, 127, 163, 0.1);
        }

        .total-row .result-label {
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1.05rem;
        }

        .total-row .result-value {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 700;
            text-shadow: 0 1px 1px rgba(0,0,0,0.02);
        }

        /* 響應式調整 */
        @media (max-width: 480px) {
            .calculator-container {
                padding: 24px 20px;
            }
            .header h1 {
                font-size: 1.3rem;
            }
            .total-row .result-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="calculator-container">
        <div class="header">
            <h1>課程報價試算器</h1>
        </div>

        <!-- 輸入欄位群組 -->
        <div class="form-group" id="students-group">
            <label for="students">學員人數</label>
            <div class="input-wrapper">
                <input type="number" id="students" min="0" placeholder="0" value="1" step="1">
            </div>
        </div>

        <div class="form-group" id="hours-group">
            <label for="hours">上課時數</label>
            <div class="input-wrapper">
                <input type="number" id="hours" min="0" placeholder="0" value="3" step="0.5">
            </div>
        </div>

        <div class="form-group" id="price-group">
            <label for="price">每小時單價 (NT$)</label>
            <div class="input-wrapper">
                <input type="number" id="price" min="0" placeholder="0" value="2500" step="100">
            </div>
        </div>

        <div class="form-group" id="discount-group">
            <label for="discount">折扣率 (%)</label>
            <div class="input-wrapper">
                <input type="number" id="discount" min="0" max="100" placeholder="0" value="10" step="5">
            </div>
            <!-- 折扣警示訊息 -->
            <div class="warning-message" id="discount-warning">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-triangle"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                折扣率過高，請確認（上限建議 30%）
            </div>
        </div>

        <!-- 試算結果區 -->
        <div class="results-section">
            <div class="result-row">
                <span class="result-label">小計</span>
                <span class="result-value" id="subtotal">NT$ 0</span>
            </div>
            <div class="result-row">
                <span class="result-label">折扣金額</span>
                <span class="result-value" id="discount-amount">NT$ 0</span>
            </div>
            <div class="result-row total-row">
                <span class="result-label">總計金額</span>
                <span class="result-value" id="grand-total">NT$ 0</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 取得 DOM 節點
            const inputStudents = document.getElementById('students');
            const inputHours = document.getElementById('hours');
            const inputPrice = document.getElementById('price');
            const inputDiscount = document.getElementById('discount');

            const txtSubtotal = document.getElementById('subtotal');
            const txtDiscountAmount = document.getElementById('discount-amount');
            const txtGrandTotal = document.getElementById('grand-total');
            const warningDiscount = document.getElementById('discount-warning');

            // 格式化為台幣千分位
            function formatCurrency(amount) {
                return 'NT$ ' + Math.round(amount).toLocaleString('zh-TW');
            }

            // 安全讀取數值，避免空白或非數字導致 NaN
            function getInputValue(inputElement) {
                const val = parseFloat(inputElement.value);
                // 檢查是否為 NaN 或小於 0 
                if (isNaN(val) || val < 0) {
                    return 0;
                }
                return val;
            }

            // 主要運算與渲染逻辑
            function calculate() {
                const students = getInputValue(inputStudents);
                const hours = getInputValue(inputHours);
                const price = getInputValue(inputPrice);
                const discountRatePercent = getInputValue(inputDiscount);

                // 折扣率上限驗證提示
                if (discountRatePercent > 30) {
                    warningDiscount.style.display = 'flex';
                } else {
                    warningDiscount.style.display = 'none';
                }

                // 進行計算
                const subtotal = students * hours * price;
                const discountAmount = subtotal * (discountRatePercent / 100);
                const grandTotal = Math.max(0, subtotal - discountAmount); // 確保總計不會變成負數

                // 渲染至畫面上
                txtSubtotal.textContent = formatCurrency(subtotal);
                txtDiscountAmount.textContent = formatCurrency(discountAmount);
                txtGrandTotal.textContent = formatCurrency(grandTotal);
            }

            // 綁定輸入監聽事件，讓數值即時更新
            const inputs = [inputStudents, inputHours, inputPrice, inputDiscount];
            inputs.forEach(input => {
                input.addEventListener('input', calculate);
                
                // 失去焦點時，若為空值則自動補 0
                input.addEventListener('blur', () => {
                    if (input.value === '') {
                        input.value = '0';
                        calculate();
                    }
                });
            });

            // 首次加載執行一次計算
            calculate();
        });
    </script>
</body>
</html>
